name: iOS Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ========== 缓存配置 ==========
      - name: Cache Kotlin/Native dependencies
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('**/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ========== 检测 TEAM_ID 并替换 Keychain Access Group ==========
      - name: Configure Keychain Access Group Team ID
        id: teamid
        run: |
          TEAM_ID="${{ vars.TEAM_ID }}"
          DEFAULT_TEAM="R6UB6VD355"
          KEYCHAIN_GROUP="com.pgigi.pumpkintoolkit.keychain.shared"

          FILES=(
            shared/src/iosMain/kotlin/com/pgigi/pumpkintoolkit/utils/KVaultUtils.ios.kt
            iosApp/TodayScheduleWidget/KeychainHelper.swift
          )

          if [ -n "$TEAM_ID" ]; then
            echo "✅ TEAM_ID provided: $TEAM_ID"
            echo "Replacing $DEFAULT_TEAM -> $TEAM_ID in source files"
            for f in "${FILES[@]}"; do
              sed -i '' "s|$DEFAULT_TEAM\.$KEYCHAIN_GROUP|$TEAM_ID.$KEYCHAIN_GROUP|g" "$f"
            done
            echo "team_id=$TEAM_ID" >> $GITHUB_OUTPUT
          else
            echo "ℹ️  TEAM_ID not set, removing Team ID prefix from source files"
            for f in "${FILES[@]}"; do
              sed -i '' "s|$DEFAULT_TEAM\.$KEYCHAIN_GROUP|$KEYCHAIN_GROUP|g" "$f"
            done
            echo "team_id=" >> $GITHUB_OUTPUT
          fi

          echo "=== Verification ==="
          for f in "${FILES[@]}"; do
            echo "--- $f ---"
            grep -n "keychain.shared\|KEYCHAIN_GROUP\|sharedAccessGroup" "$f"
          done

      # ========== 版本读取 ==========
      - name: Read version from libs.versions.toml
        id: version
        run: |
          VER_CODE=$(grep '^appVersionCode\s*=' gradle/libs.versions.toml | sed 's/.*= *"\(.*\)"/\1/')
          VER_NAME=$(grep '^appVersionName\s*=' gradle/libs.versions.toml | sed 's/.*= *"\(.*\)"/\1/')
          echo "ver_code=$VER_CODE" >> $GITHUB_OUTPUT
          echo "ver_name=$VER_NAME" >> $GITHUB_OUTPUT
          echo "========================================"
          echo "  Version Name : $VER_NAME"
          echo "  Version Code : $VER_CODE"
          echo "  TEAM_ID      : ${{ vars.TEAM_ID || '(default R6UB6VD355)' }}"
          echo "========================================"

      # ========== 同步版本到 Xcode 配置 ==========
      - name: Sync version to Config.xcconfig
        run: |
          VER_CODE="${{ steps.version.outputs.ver_code }}"
          VER_NAME="${{ steps.version.outputs.ver_name }}"
          XCCONFIG="iosApp/Configuration/Config.xcconfig"
          sed -i '' "s/^CURRENT_PROJECT_VERSION=.*/CURRENT_PROJECT_VERSION=$VER_CODE/" "$XCCONFIG"
          sed -i '' "s/^MARKETING_VERSION=.*/MARKETING_VERSION=$VER_NAME/" "$XCCONFIG"
          grep -E '^(CURRENT_PROJECT_VERSION|MARKETING_VERSION)=' "$XCCONFIG"

      # ========== 编译 Kotlin 共享框架 ==========
      - name: Build Kotlin Shared Framework (iosArm64)
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g

      # ========== Archive iOS App ==========
      - name: Archive iOS App
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/PumpkinToolkit.xcarchive \
            -destination 'generic/platform=iOS' \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.ver_code }}" \
            MARKETING_VERSION="${{ steps.version.outputs.ver_name }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      # ========== 打包 IPA ==========
      - name: Package IPA
        run: |
          APP_PATH="build/PumpkinToolkit.xcarchive/Products/Applications/PumpkinToolkit.app"
          PAYLOAD_DIR="build/ipa/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$APP_PATH" "$PAYLOAD_DIR/"
          cd build/ipa
          zip -qr PumpkinToolkit.ipa Payload
          cd ../..
          echo "IPA created at build/ipa/PumpkinToolkit.ipa"
          ls -lh build/ipa/PumpkinToolkit.ipa

      # ========== 验证 IPA 版本 ==========
      - name: Verify version in IPA
        run: |
          APP_PATH="build/PumpkinToolkit.xcarchive/Products/Applications/PumpkinToolkit.app"
          echo "=== App Version Info ==="
          plutil -p "$APP_PATH/Info.plist" | grep -E 'CFBundleShortVersionString|CFBundleVersion'
          echo ""
          echo "Expected:"
          echo "  CFBundleShortVersionString = ${{ steps.version.outputs.ver_name }}"
          echo "  CFBundleVersion = ${{ steps.version.outputs.ver_code }}"

      # ========== 验证 Widget 扩展 ==========
      - name: Verify Widget extension in IPA
        run: |
          APP_PATH="build/PumpkinToolkit.xcarchive/Products/Applications/PumpkinToolkit.app"
          WIDGET_PATH="$APP_PATH/PlugIns/TodayScheduleWidget.appex"
          echo "=== Widget Extension Check ==="
          if [ -d "$WIDGET_PATH" ]; then
            echo "✅ Widget extension found"
            echo "=== Widget Info.plist ==="
            plutil -p "$WIDGET_PATH/Info.plist" | grep -E 'CFBundleDisplayName|NSExtensionPointIdentifier'
            echo "=== Widget binary ==="
            ls -lh "$WIDGET_PATH/TodayScheduleWidget"
            echo "=== Widget symbols ==="
            nm "$WIDGET_PATH/TodayScheduleWidget" 2>/dev/null | grep -c "TodaySchedule" || echo "0 symbols (Release stripped)"
          else
            echo "❌ Widget extension NOT found in PlugIns directory"
            echo "=== Contents of app bundle ==="
            ls -la "$APP_PATH/"
            echo "=== PlugIns directory ==="
            ls -la "$APP_PATH/PlugIns/" 2>/dev/null || echo "PlugIns directory does not exist"
            exit 1
          fi

      # ========== 上传 IPA 作为构建产物 ==========
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PumpkinToolkit-${{ steps.version.outputs.ver_name }}-ios${{ steps.teamid.outputs.team_id != '' && format('-{0}', steps.teamid.outputs.team_id) || '' }}
          path: build/ipa/PumpkinToolkit.ipa
